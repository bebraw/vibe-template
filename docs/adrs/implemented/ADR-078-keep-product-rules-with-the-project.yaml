adrSchema: 1
id: ADR-078
title: Let a project define questions and answers for its own decision rules
status: implemented
date: 2026-11-26
amends:
  - ADR-076
  - ADR-077
context: |
  Kirjolab amended its PDF citation-key policy twice while retaining the library UUID as the stable source identity. A whole-record supersession would discard decisions that remain in force. Adding citation terminology to the template would make every adopter depend on one product's vocabulary.
decision: |
  A project may define a rule as a finite set of named questions with a set of permitted answers for each. The project owns the questions, answer meanings, and historical revisions. The shared CLI validates those selections, orders revisions, and renders their history. A current revision answers every question and cites the local tests that verify those answers. The evidence can span multiple suites.

  Record partial supersession separately in either declared direction. A partially superseded decision can continue to own other current rules. Keep the rationale and the specific clauses affected in the decision prose.

  An explicit records-directory argument selects a complete YAML log for experiments. Paths to product evidence resolve from the project root.
consequences: |
  Kirjolab can test the model on three historical decisions using its own vocabulary and regression tests. An author can add a question later and leave it unanswered in older revisions. A renamed meaning needs a fresh ID to preserve the interpretation of old answers. Reviewers remain responsible for inspecting definition edits and checking that tests support the claims.

  In the Kirjolab replay, ADR-083 allowed a newly created PDF draft's key to change until its first project link. ADR-154 allowed further refinement after linking and unlinking while preserving a researcher's custom project alias. The query traced the changes across ADR-076, ADR-083 and ADR-154 and linked the current answers to three test files. [Replay and verification cases](https://github.com/bebraw/kirjolab/blob/8e11e6121eccb67082cf4e3f66b3a3556bd860ae/specs/reference-library/adr-pilot/README.md)
alternatives: |
  A Kirjolab-specific rule handler would centralize PDF semantics in the template. An executable plug-in or a predicate language would require additional code to evaluate product policy. The pilot's questions can be answered by selecting named values.

  Cloudflare's Codex derives structured requirements from RFC prose by having an agent extract MUST and SHOULD statements. Our authors select answers explicitly so readers can replay the same amendments directly from the records. [Cloudflare Codex workflow](https://blog.cloudflare.com/engineering-standards-enforcement/#codex-organization-and-workflow)
extraSections:
  - heading: Vocabulary and semantic drift
    body: |
      ADMentor modeled recurring architecture questions and options separately from the choices made in an individual project. The W3C SKOS Recommendation gives vocabulary concepts stable identifiers distinct from their labels and definitions. Both informed our comparison of the pilot with prior work. [ADMentor paper](https://ozimmer.ch/assets/admentor-wicsa2015ubmissionv11nc.pdf) · [SKOS Reference](https://www.w3.org/TR/skos-reference/)

      Historical queries resolve IDs against the checked-in glossary. If an editor broadens an answer's definition under its existing ID, the record still validates and past answers acquire the broader wording. Keep the ID for a wording clarification. Give a changed meaning a new ID and retain the old definition for earlier revisions.
